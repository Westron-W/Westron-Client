          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/messages:
    post:
      operationId: sendEphemeralMessage
      tags: [friends]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
