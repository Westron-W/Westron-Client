        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_]{3,16}$" }
    SkinModel:
      name: X-Skin-Model
      in: header
      required: false
      schema: { type: string, enum: [classic, slim], default: classic }
  requestBodies:
    SkinPng:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [skin]
            additionalProperties: false
            properties:
              skin:
                type: string
                format: binary
                description: PNG image of 64x64 or 64x32 pixels, maximum 1 MiB.
    CapePng:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [cape]
            additionalProperties: false
            properties:
              cape:
                type: string
                format: binary
                description: PNG cape image of 64x32 pixels, 2:1 aspect ratio, or 22x17 OptiFine format, maximum 1 MiB.
    ElytraPng:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [elytra]
            additionalProperties: false
            properties:
              elytra:
                type: string
                format: binary
                description: PNG elytra texture of 64x32 pixels or 2:1 aspect ratio, maximum 1 MiB.
  responses:
    SessionTokens:
      description: Short-lived access token and rotating refresh token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionTokens" }
    Message:
      description: Operation result. Some messages intentionally do not reveal account existence.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Profile:
      description: Westron profile and optional public skin and cape.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Profile" }
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Username or email is already registered, or a skin already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials, or invalid refresh token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unverified:
      description: Verify the account email address before using skin operations.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCode:
      description: Resource not found or one-time code invalid/expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body or skin exceeds its configured limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Uploaded content is not a valid PNG.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSkin:
      description: PNG is invalid or its dimensions are unsupported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCape:
      description: PNG cape is invalid or its dimensions are unsupported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidElytra:
      description: PNG elytra texture is invalid or its dimensions are unsupported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Request rate limit reached. Retry after the configured interval.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LoginTemporarilyLocked:
      description: Five failed login attempts for the same email address and client address trigger a five-minute lockout.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MessageCooldown:
      description: Sending more than six text messages to the same friend or group within ten seconds blocks further messages for five seconds.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EmailUnavailable:
      description: Email provider is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected server error; internal details are not returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Registration:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9_]{3,16}$" }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    OneTimeCode:
      type: object
      additionalProperties: false
      required: [email, token]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        token: { type: string, minLength: 6, maxLength: 50, writeOnly: true }
    PasswordReset:
      type: object
      additionalProperties: false
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        token: { type: string, minLength: 6, maxLength: 50, writeOnly: true }
        newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 40, maxLength: 50, writeOnly: true }
    SessionTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn, account]
      properties:
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        tokenType: { const: Bearer }
        expiresIn: { type: integer, description: Access-token lifetime in seconds. }
        refreshExpiresIn: { type: integer, description: Refresh-token lifetime in seconds. }
        account:
          type: object
          required: [username, email, emailVerified]
          properties:
            username: { type: string }
            email: { type: string, format: email }
            emailVerified: { type: boolean }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Profile:
      type: object
      additionalProperties: false
      required: [username, skin, cape, elytra]
      properties:
        username: { type: string }
        skin:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [model, url, updatedAt]
              properties:
                model: { type: string, enum: [classic, slim] }
                url: { type: string, format: uri }
                updatedAt: { type: string, format: date-time }
        cape:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [url, updatedAt]
              properties:
                url: { type: string, format: uri }
                updatedAt: { type: string, format: date-time }
        elytra:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [url, updatedAt]
              properties:
                url: { type: string, format: uri }
                updatedAt: { type: string, format: date-time }
    FriendList:
      type: object
      additionalProperties: false
      required: [friends, incomingRequests, outgoingRequests]
      properties:
        friends:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [userId, username, minecraftUsername, online, inGame]
            properties:
              userId: { type: string }
              username: { type: string }
              minecraftUsername: { type: string, nullable: true }
              online: { type: boolean }
              inGame: { type: boolean }
        incomingRequests:
          type: array
          items: { $ref: "#/components/schemas/FriendRequest" }
        outgoingRequests:
          type: array
          items: { $ref: "#/components/schemas/FriendRequest" }
    FriendRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId, username, createdAt]
      properties:
        requestId: { type: string, format: uuid }
        userId: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
    EphemeralMessage:
      type: object
      additionalProperties: false
      required: [messageId, senderUserId, senderUsername, createdAt, kind]
      properties:
        messageId: { type: string, format: uuid }
        senderUserId: { type: string }
        senderUsername: { type: string }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [text, photo] }
    ConsumedEphemeralMessage:
      type: object
      additionalProperties: false
      required: [senderUserId, senderUsername, body, createdAt]
      properties:
        senderUserId: { type: string }
        senderUsername: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    VoiceIceServers:
      type: object
      additionalProperties: false
      required: [iceServers]
      properties:
        iceServers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [urls]
            properties:
              urls:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: string }
              username: { type: string }
              credential: { type: string }
    VoiceCallSignal:
      type: object
      additionalProperties: false
      required: [signalId, fromUserId, fromUsername, callId, type, sdp, groupId]
      properties:
        signalId: { type: string, format: uuid }
        fromUserId: { type: string }
        fromUsername: { type: string }
        groupId: { type: string, format: uuid, nullable: true }
        callId: { type: string, format: uuid }
        type: { type: string, enum: [offer, answer, candidate, hangup, reject] }
        sdp: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
