openapi: 3.1.0
info:
  title: Westron Skin API
  version: 1.0.0
  description: >
    Separate Westron account and skin service. Microsoft authentication and
    Minecraft game sessions remain independent.
servers:
  - url: https://westronclient.myvnc.com
    description: HTTPS endpoint served through Nginx Proxy Manager.
tags:
  - name: system
  - name: authentication
  - name: content
  - name: profiles
  - name: skins
  - name: capes
  - name: elytras
  - name: updates
  - name: friends
  - name: presence
paths:
  /api/health:
    get:
      operationId: healthCheck
      tags: [system]
      responses:
        "200":
          description: API and SQLite database are available.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
        "500":
          $ref: "#/components/responses/InternalError"
  /api/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      tags: [system]
      responses:
        "200":
          description: This OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        default: { $ref: "#/components/responses/InternalError" }
  /updates/{filename}:
    get:
      operationId: downloadUpdateAsset
      tags: [updates]
      summary: Download a public Westron Launcher update feed file.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: "^(latest\\.yml|(?:Westron-Launcher-Setup-|Westron-Client-Setup-|Westron Client Setup )(\\d+\\.\\d+\\.\\d+|1\\.0)\\.exe(\\.blockmap)?)$"
      responses:
        "200":
          description: Update manifest, Windows installer or blockmap file.
          content:
            text/yaml:
              schema: { type: string }
            application/vnd.microsoft.portable-executable:
              schema: { type: string, contentMediaType: application/octet-stream }
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/updates/{filename}:
    post:
      operationId: publishUpdateAsset
      tags: [updates]
      summary: Publish an update asset; restricted to the configured publisher account.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: "^(latest\\.yml|(?:Westron-Launcher-Setup-|Westron-Client-Setup-|Westron Client Setup )(\\d+\\.\\d+\\.\\d+|1\\.0)\\.exe(\\.blockmap)?)$"
      requestBody:
        required: true
        content:
          application/vnd.westron.update:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The authenticated account is not the configured update publisher.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [authentication]
      summary: Register a Westron account and send email verification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EmailUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OneTimeCode" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EmailUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/claim-legacy-account:
    post:
      operationId: claimLegacyAccount
      tags: [authentication]
      summary: Attach and verify an email address for a migrated legacy account.
      description: Requires an active pre-migration access token; only accounts without an email can use this operation.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Unverified" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EmailUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/SessionTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Email address must be verified before signing in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/LoginTemporarilyLocked" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/SessionTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EmailUnavailable" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Current session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends:
    get:
      operationId: listFriends
      tags: [friends]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Accepted friends, incoming requests and outgoing requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/search:
    get:
      operationId: searchFriends
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 16 }
          description: Username prefix; an empty value returns up to eight eligible users.
      responses:
        "200":
          description: Verified users matching the prefix who are not already friends or pending requests.
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: object
                  additionalProperties: false
                  required: [userId, username]
                  properties:
                    userId: { type: string }
                    username: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/requests:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 16, pattern: "^[A-Za-z0-9_]+$" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/requests/{requestId}/respond:
    post:
      operationId: respondToFriendRequest
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/requests/{requestId}:
    delete:
      operationId: cancelFriendRequest
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "200":
          description: Pending outgoing friend request cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cancelled]
                properties:
                  cancelled: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/{friendUserId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: friendUserId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups:
    get:
      operationId: listFriendGroups
      tags: [friends]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Groups the authenticated user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, ownerUserId, createdByUserId, createdAt, members]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string, minLength: 1, maxLength: 32 }
                    ownerUserId: { type: string, maxLength: 64 }
                    createdByUserId: { type: string, maxLength: 64 }
                    createdAt: { type: string, format: date-time }
                    members:
                      type: array
                      items:
                        type: object
                        required: [userId, username]
                        properties:
                          userId: { type: string, maxLength: 64 }
                          username: { type: string }
                          minecraftUsername: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        default: { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createFriendGroup
      tags: [friends]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, memberUserIds]
              properties:
                name: { type: string, minLength: 1, maxLength: 32 }
                memberUserIds:
                  type: array
                  maxItems: 16
                  items: { type: string, maxLength: 64 }
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                type: object
                required: [groupId, name]
                properties:
                  groupId: { type: string, format: uuid }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups/{groupId}:
    delete:
      operationId: deleteFriendGroup
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The group, its messages, photos, and pending call signals were deleted by its owner.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        default: { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: renameFriendGroup
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: Group name updated by its owner.
          content:
            application/json:
              schema:
                type: object
                required: [groupId, name]
                properties:
                  groupId: { type: string }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups/{groupId}/members/{memberUserId}:
    delete:
      operationId: removeFriendGroupMember
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: memberUserId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Member removed or self-removal processed; ownership is transferred when needed.
          content:
            application/json:
              schema:
                type: object
                required: [removed, groupDeleted]
                properties:
                  removed: { const: true }
                  groupDeleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups/{groupId}/messages:
    get:
      operationId: listFriendGroupMessages
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The latest 200 messages in chronological order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [messageId, senderUserId, senderUsername, body, kind, createdAt]
                  properties:
                    messageId: { type: string, format: uuid }
                    senderUserId: { type: string, maxLength: 64 }
                    senderUsername: { type: string }
                    body: { type: string }
                    kind: { type: string, enum: [text, photo] }
                    createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        default: { $ref: "#/components/responses/InternalError" }
    post:
      operationId: sendFriendGroupMessage
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Group message created.
          content:
            application/json:
              schema:
                type: object
                required: [messageId]
                properties:
                  messageId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "429": { $ref: "#/components/responses/MessageCooldown" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups/{groupId}/messages/{messageId}/recall:
    post:
      operationId: recallFriendGroupMessage
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's group message was removed.
          content:
            application/json:
              schema:
                type: object
                required: [recalled]
                properties:
                  recalled: { const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups/{groupId}/messages/photo:
    post:
      operationId: sendFriendGroupPhoto
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "201":
          description: Photo message created.
          content:
            application/json:
              schema:
                type: object
                required: [messageId, kind]
                properties:
                  messageId: { type: string, format: uuid }
                  kind: { const: photo }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/friends/groups/{groupId}/messages/{messageId}/photo:
    get:
      operationId: getFriendGroupPhoto
      tags: [friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Group photo available to group members.
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "404": { $ref: "#/components/responses/InvalidCode" }
        default: { $ref: "#/components/responses/InternalError" }
  /api/v1/presence:
    post:
      operationId: updatePresence
      tags: [presence]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inGame]
              properties:
                inGame: { type: boolean }
      responses:
        "200":
