services:
  westron-skin-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      DATABASE_PATH: /data/db/skin-api.sqlite
      SKINS_DIR: /data/skins
      UPDATES_DIR: /data/updates
      UPDATE_PUBLISHER_EMAIL: ${UPDATE_PUBLISHER_EMAIL:-ermiscaner78@gmail.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://westronskin.sytes.net}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - skin-api-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${NPM_DOCKER_NETWORK:?Set NPM_DOCKER_NETWORK to the existing Nginx Proxy Manager Docker network}

volumes:
  skin-api-data:
