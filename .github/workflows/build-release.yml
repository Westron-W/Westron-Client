
name: Build Westron Client

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update (must match package.json version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows Build (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win

      - name: Prepare Windows installer asset
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release/gh-assets
          cp "release/Westron-Client-Setup-${VERSION}.exe" "release/gh-assets/Westron-Client-Setup-${VERSION}.exe"
          cp "release/Westron-Client-Setup-${VERSION}.exe.blockmap" "release/gh-assets/Westron-Client-Setup-${VERSION}.exe.blockmap"
          cp release/latest.yml release/gh-assets/latest.yml

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: westron-client-windows
          path: release/gh-assets/*
          if-no-files-found: error

  build-macos:
    name: macOS Build (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Set Gradle permissions
        run: chmod +x fabric-mod/gradlew

      - name: Build macOS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:macos

      - name: Prepare macOS DMG asset
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_SOURCE=$(ls macos-client/release/*arm64*.dmg 2>/dev/null | head -n 1)
          if [ -z "$DMG_SOURCE" ]; then
            DMG_SOURCE=$(ls macos-client/release/*.dmg 2>/dev/null | head -n 1)
          fi
          if [ -z "$DMG_SOURCE" ]; then
            echo "::error::No .dmg file found in macos-client/release/"
            exit 1
          fi
          echo "Using macOS DMG source: $DMG_SOURCE"
          cp "$DMG_SOURCE" "macos-client/release/MacOS-Westron-Client-${VERSION}.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: westron-client-macos
          path: macos-client/release/MacOS-Westron-Client-*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish download links
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[publish-release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: westron-client-windows
          path: release/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: westron-client-macos
          path: release/macos

      - name: Prepare and verify release assets
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(sed -n 's/^version: //p' release/windows/latest.yml)
          if [ -n "$REQUESTED_RELEASE_TAG" ]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v${VERSION}"
          fi
          if [ "$RELEASE_TAG" != "v${VERSION}" ]; then
            echo "::error::Release tag must be v${VERSION}"
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          test -f "release/windows/Westron-Client-Setup-${VERSION}.exe" || (echo "::error::Missing Windows updater installer" && exit 1)
          test -f "release/windows/Westron-Client-Setup-${VERSION}.exe.blockmap" || (echo "::error::Missing Windows updater blockmap" && exit 1)
          test -f "release/windows/latest.yml" || (echo "::error::Missing Windows updater manifest" && exit 1)
          test -f "release/macos/MacOS-Westron-Client-${VERSION}.dmg" || (echo "::error::Missing macOS download asset" && exit 1)
          grep -qx "version: ${VERSION}" release/windows/latest.yml || (echo "::error::Manifest version does not match release tag" && exit 1)
          grep -qx "  - url: Westron-Client-Setup-${VERSION}.exe" release/windows/latest.yml || (echo "::error::Manifest does not point to the published Windows installer" && exit 1)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Westron Client ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
          files: |
            release/windows/Westron-Client-Setup-*.exe
            release/windows/Westron-Client-Setup-*.exe.blockmap
            release/windows/latest.yml
            release/macos/MacOS-Westron-Client-*.dmg

      - name: Verify published installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          VERSION="${RELEASE_TAG#v}"
          ASSETS=$(gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          EXPECTED_ASSETS=$(printf '%s\n' \
            "Westron-Client-Setup-${VERSION}.exe" \
            "Westron-Client-Setup-${VERSION}.exe.blockmap" \
            "latest.yml" \
            "MacOS-Westron-Client-${VERSION}.dmg" | sort)
          ACTUAL_ASSETS=$(printf '%s\n' "$ASSETS" | sort)
          if [ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "::error::GitHub Release is missing or has unexpected updater/download assets"
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED_ASSETS" "$ACTUAL_ASSETS"
            exit 1
          fi
