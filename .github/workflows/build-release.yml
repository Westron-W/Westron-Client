
name: Build Westron Client

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows Build (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win

      - name: Prepare Windows installer asset
        shell: bash
        run: |
          if [ -f "release/Westron Client Setup 1.0.exe" ]; then
            cp "release/Westron Client Setup 1.0.exe" "release/Windows-Westron-Client-Setup-1.0.0.exe"
          else
            WIN_EXE=$(ls release/*.exe 2>/dev/null | head -n 1)
            cp "$WIN_EXE" "release/Windows-Westron-Client-Setup-1.0.0.exe"
          fi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: westron-client-windows
          path: release/Windows-Westron-Client-Setup-1.0.0.exe
          if-no-files-found: error

  build-macos:
    name: macOS Build (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Set Gradle permissions
        run: chmod +x fabric-mod/gradlew

      - name: Build macOS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:macos

      - name: Prepare macOS DMG asset
        run: |
          DMG_SOURCE=$(ls macos-client/release/*arm64*.dmg 2>/dev/null | head -n 1)
          if [ -z "$DMG_SOURCE" ]; then
            DMG_SOURCE=$(ls macos-client/release/*.dmg 2>/dev/null | head -n 1)
          fi
          if [ -z "$DMG_SOURCE" ]; then
            echo "::error::No .dmg file found in macos-client/release/"
            exit 1
          fi
          echo "Using macOS DMG source: $DMG_SOURCE"
          cp "$DMG_SOURCE" "macos-client/release/MacOS-Westron-Client-1.0.0.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: westron-client-macos
          path: macos-client/release/MacOS-Westron-Client-1.0.0.dmg
          if-no-files-found: error

  publish-release:
    name: Publish download links
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: westron-client-windows
          path: release/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: westron-client-macos
          path: release/macos

      - name: Prepare and verify release assets
        run: |
          if [ -f "release/windows/Westron Client Setup 1.0.exe" ] && [ ! -f "release/windows/Windows-Westron-Client-Setup-1.0.0.exe" ]; then
            mv "release/windows/Westron Client Setup 1.0.exe" "release/windows/Windows-Westron-Client-Setup-1.0.0.exe"
          fi
          if [ ! -f "release/macos/MacOS-Westron-Client-1.0.0.dmg" ]; then
            DMG_SOURCE=$(ls release/macos/*arm64*.dmg 2>/dev/null | head -n 1)
            if [ -z "$DMG_SOURCE" ]; then
              DMG_SOURCE=$(ls release/macos/*.dmg 2>/dev/null | head -n 1)
            fi
            if [ -n "$DMG_SOURCE" ]; then
              cp "$DMG_SOURCE" "release/macos/MacOS-Westron-Client-1.0.0.dmg"
            fi
          fi
          test -f "release/windows/Windows-Westron-Client-Setup-1.0.0.exe" || (echo "::error::Missing Windows-Westron-Client-Setup-1.0.0.exe" && exit 1)
          test -f "release/macos/MacOS-Westron-Client-1.0.0.dmg" || (echo "::error::Missing MacOS-Westron-Client-1.0.0.dmg" && exit 1)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Westron Client ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/windows/Windows-Westron-Client-Setup-1.0.0.exe
            release/macos/MacOS-Westron-Client-1.0.0.dmg
